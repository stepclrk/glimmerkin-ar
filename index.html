<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#241640">
<title>Glimmerkin AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mystery+Quest&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #fff7ec; --dim: #cbbde8; --gold: #ffcf6b; --panel: rgba(28, 16, 52, .82); --rose: #ff7a9c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241640; color: var(--ink); font: 16px/1.4 Nunito, system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #touch, #draw { position: absolute; inset: 0; width: 100%; height: 100%; }
  #draw { pointer-events: none !important; }
  h1 { font: 44px/1 'Mystery Quest', cursive; margin: 0 0 6px; color: var(--gold); text-shadow: 0 2px 12px rgba(255, 180, 80, .35); }
  button { font: 800 16px Nunito, system-ui, sans-serif; color: #2a1640; background: var(--gold); border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
  button.ghost { background: rgba(255, 255, 255, .14); color: var(--ink); }
  button:disabled { opacity: .45; }
  #menu { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 16px calc(22px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(20, 10, 40, .92) 30%); text-align: center; transition: opacity .3s, transform .3s; }
  #menu.off { opacity: 0; transform: translateY(30px); pointer-events: none !important; }
  #menu p { margin: 4px 0 14px; color: var(--dim); }
  #menu .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  #menu .row button { min-width: 150px; }
  #hud { display: none; pointer-events: none !important; }
  #hud.on { display: block; }
  #hud > * { pointer-events: auto; }
  .top { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; }
  .card { background: var(--panel); border-radius: 16px; padding: 8px 12px; }
  .who { flex: 1; min-width: 0; }
  .who b { font: 22px/1 'Mystery Quest', cursive; color: var(--gold); }
  .who small { color: var(--dim); margin-left: 6px; }
  .meters { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .m { flex: 1; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .15); overflow: hidden; margin-top: 2px; }
  .bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; transition: width .4s; }
  .bar i.low { background: var(--rose); }
  .top button { padding: 10px 14px; font-size: 14px; }
  .bottom { position: absolute; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; pointer-events: none !important; }
  .bottom > * { pointer-events: auto; }
  #tricks-btn { justify-self: start; } #move { justify-self: end; }
  #berry { width: 84px; height: 84px; border-radius: 50%; padding: 0; background: radial-gradient(circle at 38% 34%, #ff8fb3, #d8326b 60%, #8e1a45); box-shadow: 0 0 0 4px rgba(255, 255, 255, .18), 0 6px 20px rgba(0, 0, 0, .4); color: #fff; font-size: 12px; line-height: 1.1; touch-action: none; }
  #berry span { display: block; font-size: 11px; font-weight: 700; opacity: .9; }
  #toast { position: absolute; left: 50%; top: calc(96px + env(safe-area-inset-top)); transform: translate(-50%, -10px); max-width: min(92vw, 460px); background: var(--panel); border-radius: 14px; padding: 10px 14px; text-align: center; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none !important; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #place-hint { position: absolute; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel); border-radius: 999px; padding: 10px 16px; white-space: nowrap; display: none; pointer-events: none !important; }
  #place-hint.on { display: block; }
  .float { position: absolute; left: 0; top: 0; width: 120px; text-align: center; font: 800 18px Nunito, sans-serif; color: var(--gold); text-shadow: 0 2px 6px rgba(0, 0, 0, .6); pointer-events: none !important; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #2c1a50; border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .3s; max-height: 80vh; overflow: auto; }
  .sheet.on { transform: none; }
  .sheet h2 { margin: 0 0 8px; font: 28px/1.1 'Mystery Quest', cursive; color: var(--gold); }
  .sheet p { color: var(--dim); margin: 0 0 10px; }
  .sheet ul { list-style: none; padding: 0; margin: 0 0 14px; }
  .sheet li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
  .sheet li span { color: var(--gold); white-space: nowrap; }
  textarea { width: 100%; min-height: 110px; border-radius: 12px; border: 0; padding: 10px; font: 13px ui-monospace, monospace; background: #1b0f33; color: var(--ink); user-select: text; -webkit-user-select: text; }
  .err { color: var(--rose); min-height: 1.4em; margin: 6px 0; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .dust { font-size: 12px; color: var(--gold); margin-top: 4px; }
  .side { position: absolute; right: 12px; top: calc(118px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .side button { padding: 10px 14px; font-size: 14px; }
  .berrywrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #berry { background: radial-gradient(circle at 38% 34%, hsl(var(--h, 330) 90% 78%), hsl(var(--h, 330) 70% 52%) 60%, hsl(var(--h, 330) 70% 30%)); }
  #berry.empty { filter: grayscale(1); opacity: .6; }
  .chip-btn { padding: 6px 10px; font-size: 12px; background: rgba(255, 255, 255, .14); color: var(--ink); }
  body.questing #toast { top: calc(170px + env(safe-area-inset-top)); }
  .qtop { position: absolute; left: 12px; right: 12px; top: calc(104px + env(safe-area-inset-top)); text-align: center; }
  .qtop b { font: 20px/1.1 'Mystery Quest', cursive; color: var(--gold); display: block; }
  .qtop small { color: var(--dim); }
  .qbottom { position: absolute; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  #q-lits { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #q-lits .lit { background: var(--panel); color: var(--ink); border-radius: 14px; padding: 6px 10px; font-size: 13px; border-left: 5px solid hsl(var(--h) 70% 60%); text-align: left; }
  #q-lits .lit b { display: block; } #q-lits .lit span { color: var(--gold); letter-spacing: 1px; } #q-lits .lit i { color: var(--dim); font-style: normal; }
  #q-lits .lit.held { outline: 2px solid #cfd8ff; }
  .qbtns { display: flex; gap: 10px; justify-content: center; }
  .sheet .row { display: block; width: 100%; text-align: left; margin: 0 0 8px; border-radius: 14px; background: rgba(255, 255, 255, .1); color: var(--ink); padding: 10px 14px; }
  .sheet .row.portal, .sheet .row.lit-row { border-left: 6px solid hsl(var(--h) 70% 60%); }
  .sheet .row b { display: block; } .sheet .row small { color: var(--dim); font-weight: 400; }
  .sheet h3 { margin: 14px 0 6px; color: var(--gold); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { background: rgba(255, 255, 255, .12); color: var(--ink); padding: 8px 12px; font-size: 14px; }
  .chip small { color: var(--dim); font-weight: 400; } .chip.on { background: var(--gold); color: #2a1640; } .chip.on small { color: #4a2a60; }
  .sheet li em { color: var(--dim); font-style: normal; font-size: 13px; }
  .sheet ul.loot li { justify-content: flex-start; }
  #room-hint, #play-hint { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(92vw, 420px); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 14px; text-align: center; display: none; pointer-events: none !important; }
  #room-hint.on, #play-hint.on { display: block; }
  #play-hint { color: var(--gold); font-weight: 800; }
  #count { position: absolute; inset: 0; background: rgba(14, 6, 30, .9); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; pointer-events: none !important; }
  #count.on { display: flex; }
  #count b { font: 120px/1 'Mystery Quest', cursive; color: var(--gold); }
  #count p { color: var(--dim); max-width: 320px; }
  #arrow { position: absolute; left: 0; top: 0; width: 56px; height: 56px; display: none; pointer-events: none !important; }
  #arrow.on { display: block; }
  #arrow i { position: absolute; inset: 0; display: block; }
  #arrow i::before { content: ''; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-top: 13px solid transparent; border-bottom: 13px solid transparent; border-left: 22px solid var(--gold); transform: translate(-30%, -50%); filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  #arrow span { position: absolute; left: -12px; right: -12px; top: 52px; text-align: center; font-size: 12px; font-weight: 800; color: var(--gold); text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  @media (max-width: 380px) { #menu .row button { min-width: 0; flex: 1; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<div id="stage"></div>
<div id="overlay">
  <div id="touch"></div>
  <canvas id="draw"></canvas>
  <div id="hud">
    <div class="top">
      <div class="card who">
        <b id="name"></b><small id="form"></small>
        <div class="meters"><div class="m">Joy<div class="bar"><i id="joy"></i></div></div><div class="m">Belly<div class="bar"><i id="belly"></i></div></div><div class="m">Rest<div class="bar"><i id="rest"></i></div></div></div>
        <div class="dust" id="dust"></div>
      </div>
      <button id="leave" class="ghost">Leave</button>
    </div>
    <div id="nest-ui">
      <div class="side"><button id="where">Where to?</button><button id="play">Play</button><button id="come" class="ghost" hidden>Come here</button><button id="sleep" class="ghost">Sleep</button></div>
      <div class="bottom">
        <button id="tricks-btn" class="ghost">Tricks <small id="tricks-n"></small></button>
        <div class="berrywrap"><button id="berry" aria-label="Berry: flick up to throw, tap to toss"><span id="berry-name"></span><span>flick up</span></button><button id="berry-change" class="chip-btn" hidden>Change berry</button></div>
        <button id="move" class="ghost" hidden>Move</button>
      </div>
    </div>
    <div id="quest-ui" hidden>
      <div class="qtop card"><b id="q-name"></b><small id="q-shards"></small></div>
      <div class="qbottom">
        <div id="q-lits"></div>
        <div class="qbtns"><button id="q-rally" class="ghost">Rally</button><button id="q-home" class="ghost">Head home</button></div>
      </div>
    </div>
  </div>
  <div id="place-hint"></div>
  <div id="room-hint"></div>
  <div id="play-hint"></div>
  <div id="arrow"><i></i><span></span></div>
  <div id="count"><b>10</b><p></p></div>
  <div id="toast" role="status"></div>
  <div id="menu">
    <h1>Glimmerkin AR</h1>
    <p id="menu-name"></p>
    <div class="row"><button id="start-ar" disabled>Start AR</button><button id="start-preview" class="ghost">Preview on this screen</button></div>
    <p id="ar-status" style="margin-top:12px">Checking for AR…</p>
    <div class="row"><button id="bring" class="ghost">Bring in your Glimmerkin</button><button id="fresh" class="ghost">New creature</button></div>
  </div>
  <div id="sheet" class="sheet"></div>
</div>
<script src="src/core.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
